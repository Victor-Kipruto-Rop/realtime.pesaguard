services:
  - type: web
    name: realtime-pesaguard
    runtime: docker
    plan: starter
    healthCheckPath: /health/live
    autoDeploy: false
    envVars:
      - key: MIX_ENV
        value: prod
      - key: PHX_SERVER
        value: "true"
      - key: PHX_HOST
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: PESAGUARD_EVENT_INGEST_TOKEN
        sync: false
      - key: PESAGUARD_JWT_HS256_SECRET
        sync: false
      - key: PESAGUARD_JWT_ISSUER
        sync: false
      - key: PESAGUARD_JWT_AUDIENCE
        sync: false
      - key: PESAGUARD_ALLOWED_ORIGINS
        sync: false
